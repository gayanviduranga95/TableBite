# TableBite reads its configuration from ENVIRONMENT VARIABLES, not from this file,
# so that no credentials are ever committed. See backend/.env.example for the full list.
#
# Defaults used when a variable is not set:
#   DB_URL      = jdbc:postgresql://localhost:5432/tablebite_db
#   HTTP_PORT   = 8080
#   WEBSOCKET_PORT = 8081
#   TCP_PORT    = 5000
#   UPLOAD_DIR  = uploads
# Required: DB_USER, DB_PASSWORD
